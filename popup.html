<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Website Makeover</title>

  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-bottom: 20px;
    }

    .section {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .themes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .theme {
      background: #eeeeee;
    }

    .control {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="color"] {
      width: 100%;
      height: 35px;
      border: none;
      cursor: pointer;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    .range-value {
      font-size: 12px;
      color: #666;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .checkbox label {
      margin: 0;
    }

    .main-buttons {
      display: flex;
      gap: 8px;
    }

    #apply {
      flex: 1;
      background: #222;
      color: white;
    }

    #reset {
      flex: 1;
      background: #ddd;
    }

    .feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature-text {
      font-size: 13px;
    }

    .feature-text strong {
      display: block;
      margin-bottom: 3px;
    }

    .feature-text span {
      color: #777;
      font-size: 11px;
    }

    .toggle {
      width: 42px;
      height: 22px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      font-size: 10px;
      color: #999;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>✨ Website Makeover</h1>
  <div class="subtitle">Design the website your way</div>

  <!-- QUICK THEMES -->
  <div class="section">
    <div class="section-title">🎨 Quick Themes</div>

    <div class="themes">
      <button class="theme" data-theme="dark">🌙 Dark</button>
      <button class="theme" data-theme="pastel">🌸 Pastel</button>
      <button class="theme" data-theme="cyberpunk">⚡ Cyberpunk</button>
      <button class="theme" data-theme="retro">📻 Retro</button>
    </div>
  </div>

  <!-- CUSTOMIZATION -->
  <div class="section">

    <div class="section-title">🛠️ Customize</div>

    <div class="control">
      <label>Background Color</label>
      <input type="color" id="backgroundColor" value="#ffffff">
    </div>

    <div class="control">
      <label>Text Color</label>
      <input type="color" id="textColor" value="#222222">
    </div>

    <div class="control">
      <label>Font</label>

      <select id="font">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
        <option value="Courier New">Courier New</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
      </select>
    </div>

    <div class="control">
      <label>Text Size</label>

      <input
        type="range"
        id="textSize"
        min="80"
        max="130"
        value="100"
      >

      <span class="range-value" id="sizeValue">100%</span>
    </div>

    <div class="control">
      <label>Roundness</label>

      <input
        type="range"
        id="roundness"
        min="0"
        max="30"
        value="0"
      >

      <span class="range-value" id="roundValue">0px</span>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="hideImages">
      <label for="hideImages">Hide images</label>
    </div>

    <div class="main-buttons">
      <button id="apply">✨ Apply</button>
      <button id="reset">↩ Reset</button>
    </div>

  </div>

  <!-- EXTRA FEATURES -->
  <div class="section">

    <div class="section-title">✨ Extra Features</div>

    <div class="feature">

      <div class="feature-text">
        <strong>📖 Reading Mode</strong>
        <span>Remove distractions and focus on content</span>
      </div>

      <input
        type="checkbox"
        class="toggle"
        id="readingMode"
      >

    </div>

    <div class="feature">

      <div class="feature-text">
        <strong>🖼️ Blur Images</strong>
        <span>Images become clear when you hover</span>
      </div>

      <input
        type="checkbox"
        class="toggle"
        id="blurImages"
      >

    </div>

  </div>

  <footer>
    Website Makeover • v6.0
  </footer>

  <script src="popup.js"></script>

</body>
</html>
